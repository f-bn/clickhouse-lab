#---------------------------------------------------------------------
# Tools
#---------------------------------------------------------------------
[tools]
clickhouse = "{{ env.CLICKHOUSE_VERSION }}"

#---------------------------------------------------------------------
# Variables
#---------------------------------------------------------------------
[vars]
datasets_dir = "datasets"

#---------------------------------------------------------------------
# Environment variables
#---------------------------------------------------------------------
[env]
# Versions
CLICKHOUSE_VERSION = "26.9.8.3"
POSTGRESQL_VERSION = "18.6"

# Connection paramaters
CLICKHOUSE_USER = "clickhouse"
CLICKHOUSE_PASSWORD = "clickhouse"
CLICKHOUSE_HOST = "localhost"
POSTGRESQL_PASSWORD = "postgres"

#---------------------------------------------------------------------
# Tasks
#---------------------------------------------------------------------

# - Stack management -
[tasks.start]
description = "Start stack"
usage = '''
flag "--enable-pg" help="Enable PostgreSQL integration" default=#false
'''
run = '''
docker compose \
{% if usage.enable_pg %}--profile='integration-pg'{% endif %} \
up -d
'''

[tasks.stop]
description = "Stop stack"
run = "docker compose --profile='*' stop"

[tasks.clean]
description = "Clean all stack resources (services, volumes, networks)"
run = [
  "docker compose --profile='*' down --volumes --remove-orphans",
  "rm -f {{ cwd }}/.clickhouse-history"
]

[tasks.reset]
description = "Reset stack from scratch"
run = [
    { task = "clean" },
    { task = "start" }
]

[tasks.logs]
description = "Get logs from a given service"
usage = '''
arg "<service>" help="Name of the service to display logs from" {
  choices "clickhouse" "pg"
}
flag "-f --follow" help="Follow log output" default=#false
'''
run = "docker compose logs {{ usage.service }} {% if usage.follow %}--follow{% endif %}"

# - Datasets management -
[tasks.load-dataset]
description = "Load sample dataset into ClickHouse"
usage = '''
arg "<name>" {
  choices "cell-towers" "ontime"
  help "Name of the dataset to load"
}
'''
run = "clickhouse-client --progress --time --queries-file={{ vars.datasets_dir }}/{{ usage.name }}.sql"

# - Misc -
[tasks.client]
description = "Connect to ClickHouse using CLI client"
alias = "cli"
interactive = true
raw_args = true
run = "clickhouse-client --history_file={{ cwd }}/.clickhouse-history"

[tasks.dashboard]
description = "Open embedded ClickHouse dashboard in browser"
alias = "dash"
run = "xdg-open http://localhost:8123/dashboard?user={{ env.CLICKHOUSE_USER }}"

[tasks.sql]
description = "Open embedded ClickHouse SQL console in browser"
run = "xdg-open http://localhost:8123/play?user={{ env.CLICKHOUSE_USER }}"
