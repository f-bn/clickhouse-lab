---
name: clickhouse-lab

#---------------------------------------------------------------------
# Services
#---------------------------------------------------------------------
services:
  clickhouse:
    image: ghcr.io/f-bn/clickhouse:${CLICKHOUSE_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-ch
    hostname: clickhouse
    environment:
      CLICKHOUSE_USER: ${CLICKHOUSE_USER}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - type: bind
        source: ./configs/clickhouse/backups.xml
        target: /etc/clickhouse-server/config.d/01-backups.xml
        bind: { selinux: Z }
      - type: volume
        source: ch-data
        target: /var/lib/clickhouse
      - type: volume
        source: ch-backup-data
        target: /var/lib/clickhouse/backup
    ports:
      - 127.0.0.1:8123:8123 # HTTP port
      - 127.0.0.1:9000:9000 # Native Protocol port
      - 127.0.0.1:9004:9004 # MySQL emulation port
      - 127.0.0.1:9005:9005 # PostgreSQL emulation port
    mem_limit: 16gb

  pg:
    profiles: ['integration-pg']
    image: ghcr.io/f-bn/postgresql:${POSTGRESQL_VERSION}
    container_name: ${COMPOSE_PROJECT_NAME}-pg
    hostname: clickhouse-pg
    environment:
      POSTGRES_PASSWORD: ${POSTGRESQL_PASSWORD}
    volumes:
      - type: volume
        source: pg-data
        target: /var/lib/postgresql
    ports: ['127.0.0.1:5432:5432'] 
    mem_limit: 2gb
    depends_on:
      clickhouse:
        condition: service_started

#---------------------------------------------------------------------
# Volumes
#---------------------------------------------------------------------
volumes:
  ch-data:
    driver: local
  ch-backup-data:
    driver: local
  pg-data:
    driver: local

#---------------------------------------------------------------------
# Network
#---------------------------------------------------------------------
networks:
  default:
    name: ${COMPOSE_PROJECT_NAME}-net
